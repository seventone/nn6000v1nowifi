name: Cache-Clean

on:
  # 自动清理已禁用（避免每次编译都要重新拉取源码和 toolchain，严重变慢）
  # 缓存 GitHub 官方配额：公共仓库 10 GB / 仓库，超出会按 LRU 自动淘汰最旧条目。
  #  ImmortalWrt 一次 ccache+dl+toolchain 缓存约 4~7GB，10GB 足够容纳最近 1~2 次。
  # 官方 LRU 自动淘汰对重复编译的命中率更友好，比手动全删更好。
  #
  # 如需手动清理（例如源码升级导致旧缓存明显拖慢编译），到：
  #   Actions → Cache-Clean → Run workflow
  # 手动触发一次即可，全部缓存立即清空。
  #schedule:
  #  - cron: 0 20 * * 0
  #手动清理
  workflow_dispatch:

permissions: write-all

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Cache Clean
        run: gh cache delete --all
