#CI项目
name: NN6000-V1-WIFI-NO

#CI计划
on:
  #仅手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

#CI权限
permissions: write-all

#CI任务
jobs:
  config:
    name: NN6000 V1 No WiFi
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [IPQ60XX-WIFI-NO]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [main]

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题（仅留 Argon）
      WRT_THEME: argon
      #默认主机名
      WRT_NAME: NN6000
      #无 WiFi 版，以下参数预留不生效
      WRT_SSID: NN6000
      WRT_WORD: 12345678
      #默认地址（旁路由静态 IP，与 Settings.sh 中保持一致）
      WRT_IP: 10.0.0.30
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST}}
